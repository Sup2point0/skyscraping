name: 'Github Pages Deployment'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy.yaml'
      - 'package-lock.json'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
        
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: '› npm ci'
        run: |
          npm ci

      - name: '› npm build'
        run: |
          npm run build

      - name: 'Upload Pages Artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 'Deploy Pages'
        id: deployment
        uses: actions/deploy-pages@v4
